<body>
    <div class="contenedor">
        <a href="../../miIndex.html" class="volver">← Volver al índice</a>
        <header>
            <span class="etiqueta">EJERCICIO 16</span>
            <h1>Convertir grados Celsius a Fahrenheit</h1>
            <p>Escribe una función que convierta grados Celsius a Fahrenheit aplicando la fórmula <code>Fahrenheit = (Celsius * 9/5) + 32</code>.</p>
        </header>
        <main class="panel">
            <label for="celsiusInput">Grados Celsius (°C):</label>
            <input type="number" id="celsiusInput" placeholder="Ej: 25">
            <button id="btnConvertir">Convertir</button>
            <p class="ayuda">Resultado:</p>
            <div id="resultado" class="resultado"></div>
        </main>
        <footer>DWECL · UD 1 · Fundamentos JS</footer>
